name: Build LinkToon Android APK & Deploy Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Gradle Wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkToon-App-Debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Deploy Web Assets to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/src/main/assets
          publish_branch: gh-pages

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.3.0
          name: LinkToon Android v1.3.0 (최종 완전 무설치 자동 업데이트 버전)
          body: |
            ### 🚀 링크툰(LinkToon) v1.3.0 (최종 완결판)
            
            - **영구 무설치 자동 업데이트 아키텍처 완성:** 뷰어 태그 감지 및 회차 추출 로직까지 100% 웹(GitHub)에서 실시간으로 원격 공급하도록 개편되었습니다.
            - 앞으로 태그/스타일/로직/디자인/웹툰 목록이 바뀌어도 **스마트폰에서 APK를 다시 설치할 일이 영원히 없습니다 (0%).**
            - `<h2 style="...padding-left:60px...">` 등 특정 태그 감지 및 문장 끝 `xxx화` 정밀 추출 지원.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

