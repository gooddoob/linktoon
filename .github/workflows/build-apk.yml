name: Build LinkToon Android APK & Deploy Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Gradle Wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Restore Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 secret이 없습니다"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/linktoon.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/linktoon.p12" >> "$GITHUB_ENV"

      - name: Assemble Debug APKs (Personal & Clean)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assemblePersonalDebug assembleCleanDebug --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/personal/debug/*.apk dist/app-debug.apk
          cp app/build/outputs/apk/clean/debug/*.apk dist/LinkToon-Clean.apk

      - name: Verify Signing Certificate
        # 고정 키의 인증서 SHA-256. 서명이 다르면 기존 앱 위에 설치가 안 되므로 여기서 빌드를 실패시킨다.
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do
            "$apksigner" verify --print-certs "$apk" | grep -qi "f591bbb3339782d85e5cb29445f41aa209244999566805cbee291f41cb176a9d" \
              || { echo "::error::$apk 서명 인증서가 고정 키와 다릅니다"; exit 1; }
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkToon-App-Debug
          path: dist/*.apk

      - name: Deploy Web Assets to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/src/main/assets
          publish_branch: gh-pages

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.4.2
          name: LinkToon Android v1.4.2 (서명 키 고정, 웹툰/소설 표지 선택 검색)
          body: |
            ### 링크툰(LinkToon) v1.4.2

            - **서명 키 고정:** 이 버전부터 모든 빌드가 같은 키로 서명됩니다. v1.4.1 이하에서 올라올 때는 서명이 달라 한 번 삭제 후 설치해야 하고(삭제 전 설정에서 백업 텍스트 복사), 이후로는 덮어쓰기 업데이트가 됩니다.
            - **표지 검색 분류:** 자동 검색은 카카오페이지 웹툰 표지만 찾고, 등록 화면에서 `웹툰 표지 찾기` / `소설 표지 찾기`를 고를 수 있습니다.
            - `app-debug.apk`: 개인용 / `LinkToon-Clean.apk`: 친구 공유용(빈 화면으로 시작)
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

