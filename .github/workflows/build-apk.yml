name: Build LinkToon Android APK & Deploy Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Gradle Wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkToon-App-Debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Deploy Web Assets to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/src/main/assets
          publish_branch: gh-pages

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.2.1
          name: LinkToon Android v1.2.1 (특정 h2 태그 및 마지막 xxx화 자동 추출)
          body: |
            ### 🚀 링크툰(LinkToon) v1.2.1 업데이트 내역
            
            - **특정 태그 기반 회차 추출:** `<h2 style="...padding-left:60px...">` 등 웹페이지 내 주요 헤딩 태그를 정밀 탐색하여 텍스트를 감지합니다.
            - **마지막 `xxx화` 부분만 정밀 추출:** 태그 안의 긴 제목 전체 대신, 문장 맨 뒤에 적힌 회차(`150화`, `123화` 등)만 쏙 뽑아내어 카드 정보에 저장합니다.
            - **모든 링크 범용 지원:** 특정 h2 태그가 없는 사이트라도 URL(`?no=123`) 및 제목에서 마지막 `xxx화`를 찾아 자동으로 갱신합니다.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

