name: Build LinkToon Android APK & Deploy Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Gradle Wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkToon-App-Debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Deploy Web Assets to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/src/main/assets
          publish_branch: gh-pages

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.2.0
          name: LinkToon Android v1.2.0 (회차 자동 감지 및 시인성 강화)
          body: |
            ### 🚀 링크툰(LinkToon) v1.2.0 업데이트 내역
            
            - **회차 및 제목 정보 자동 감지 (Zero Click):** 뷰어에서 웹툰 감상 후 뒤로가기를 누르면 웹페이지 제목과 URL로부터 최신 회차(예: `123화`)를 자동으로 감지하여 메모/정보를 갱신합니다.
            - **정보 텍스트 시인성 대폭 강화:** 카드 하단 정보 글자를 흐린 회색 대신 선명한 에메랄드 뱃지(`[🔖 123화]`) 형태로 개편하여 한눈에 들어오도록 개선했습니다.
            - **자동 갱신 토스트 알림:** 뒤로가기 시 방금 읽은 회차가 무엇으로 갱신되었는지 하단 팝업으로 즉시 안내합니다.
            - **실시간 무설치 자동 업데이트(OTA):** 온라인 CDN(`https://gooddoob.github.io/linktoon/`) 연동 지원.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

