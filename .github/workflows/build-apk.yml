name: Build LinkToon Android APK & Deploy Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Gradle Wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APKs (Personal & Clean)
        run: |
          ./gradlew assemblePersonalDebug assembleCleanDebug --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/personal/debug/*.apk dist/app-debug.apk
          cp app/build/outputs/apk/clean/debug/*.apk dist/LinkToon-Clean.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkToon-App-Debug
          path: dist/*.apk

      - name: Deploy Web Assets to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/src/main/assets
          publish_branch: gh-pages

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.4.1
          name: LinkToon Android v1.4.1 (카카오페이지 썸네일 검색 안정화)
          body: |
            ### 🚀 링크툰(LinkToon) v1.4.0 업데이트 내역
            
            - **카카오페이지 원본 썸네일 자동 검색:** 새 링크 등록 시 썸네일을 비워두거나 `[카카오페이지 자동 찾기]` 버튼을 누르면 제목에 맞는 원본 웹툰 표지를 자동으로 찾아서 등록합니다.
            - **사용자 목록 100% 보존:** 기존 폰에 등록/수정/삭제해 둔 내 목록을 절대 덮어쓰거나 훼손하지 않습니다.
            - **개인용 & 친구 공유용 동시 빌드:**
              - `app-debug.apk`: 개인용 (기존 목록 유지)
              - `LinkToon-Clean.apk`: 친구 공유용 (완전 빈 화면으로 시작, 동일하게 자동 업데이트 지원)
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

